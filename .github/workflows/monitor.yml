name: PokéRadar
run-name: "${{ inputs.origen == 'reloj' && 'Reloj · cada 15 min' || (github.event_name == 'schedule' && 'Respaldo de GitHub' || (github.event_name == 'workflow_dispatch' && (inputs.test_notify && 'Aviso de prueba' || 'Revisión manual') || 'Cambios en la app')) }}"

on:
  schedule:
    # RESPALDO. El reloj puntual es externo (cron-job.org → workflow_dispatch con origen=reloj,
    # ver README): el programador gratuito de GitHub se salta o retrasa muchas ejecuciones.
    # Si el reloj acaba de revisar, estas pasadas terminan en segundos sin hacer nada.
    - cron: "4,19,34,49 * * * *"
  push:                       # al cambiar config.toml o la app se ejecuta y publica al momento
    branches: [main]
    paths: ["config.toml", "pokeradar/**", "docs/*.html", "docs/*.js", "docs/*.css", "docs/*.webmanifest", "docs/icons/**"]
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
    inputs:
      test_notify:
        description: "Enviar solo un aviso de prueba al iPhone"
        type: boolean
        default: false
      origen:
        description: "Quién lo lanza (el reloj externo envía «reloj»)"
        type: string
        default: manual

permissions:
  contents: write   # guardar el estado (docs/data) en el repositorio
  pages: write      # publicar la app en GitHub Pages
  id-token: write

concurrency:
  group: pokeradar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # se acepta tanto como secret como en la pestaña "Variables"
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER || vars.NTFY_SERVER }}
      NTFY_TOPIC_SOURCE: ${{ secrets.NTFY_TOPIC != '' && 'Secrets' || (vars.NTFY_TOPIC != '' && 'Variables' || 'ninguno') }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
      AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      AMAZON_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREDENTIAL_VERSION }}
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      POKERADAR_TRIGGER: ${{ inputs.origen == 'reloj' && 'reloj' || github.event_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # la última versión de la rama, no la del momento del disparo: si esta ejecución
          # esperó en cola a otra, parte de sus datos y no repite avisos ya enviados
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Aviso de prueba
        if: ${{ inputs.test_notify }}
        run: python -m pokeradar --test-notify

      - name: Vigilar tiendas
        if: ${{ !inputs.test_notify }}
        run: python -m pokeradar ${{ github.event_name == 'schedule' && '--min-gap 12' || '' }}

      - name: Guardar estado
        id: save
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name  "pokeradar-bot"
          git config user.email "pokeradar-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "datos: $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q && break
              sleep $((i * 5))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar web
        if: ${{ steps.save.outputs.changed == 'true' || github.event_name != 'schedule' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar en GitHub Pages
        id: deploy
        if: ${{ steps.save.outputs.changed == 'true' || github.event_name != 'schedule' }}
        uses: actions/deploy-pages@v4
