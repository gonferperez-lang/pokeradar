name: Reloj
run-name: Reloj · próxima revisión en 15 min

# Lanza una revisión de las tiendas cada 15 minutos, sin servicios externos ni tokens.
# Cada ejecución espera en el entorno «reloj» (temporizador «Wait timer» de GitHub, que se
# cumple con puntualidad y no consume minutos), programa la siguiente y lanza la revisión.
# Si la cadena se rompe, la siguiente ejecución de monitor.yml (respaldo de GitHub, botón
# «Revisar» o un cambio en la app) la vuelve a arrancar.
#
# Activación (una sola vez): Settings → Environments → reloj → Wait timer = 15 → Save.

on:
  workflow_dispatch:

permissions:
  actions: write   # lanzar monitor.yml y la siguiente vuelta del reloj

jobs:
  tic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: reloj
    # (sin «concurrency»: una ejecución que GitHub deja colgada bloquearía el grupo para siempre,
    #  como pasó el 5 nov. 2026; las cadenas duplicadas se resuelven en el primer paso)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Comprobar el temporizador
        id: check
        run: |
          created=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          waited=$(( $(date +%s) - $(date -d "$created" +%s) ))
          echo "Ha esperado $((waited / 60)) min $((waited % 60)) s."
          if [ "$waited" -lt 600 ]; then
            # sin temporizador la cadena daría vueltas sin pausa: se detiene
            echo "::warning title=Reloj sin activar::Falta el temporizador: Settings → Environments → reloj → marca «Wait timer», pon 15 y pulsa «Save protection rules»."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ¿hay otra vuelta del reloj más reciente y viva (de los últimos 20 min)? Entonces sobra esta
          # cadena: se para para no duplicar revisiones. Las colgadas (más antiguas) no cuentan.
          newer=$(gh run list --workflow reloj.yml --limit 20 --json databaseId,status,createdAt --jq \
            "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\" and .createdAt > \"$created\"
                    and (now - (.createdAt | fromdateiso8601)) < 1200)] | length")
          if [ "${newer:-0}" != "0" ]; then
            echo "Hay otra cadena del reloj más reciente: esta se detiene."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub a veces responde con un error pasajero (HTTP 502): se reintenta hasta 3 veces
      - name: Programar la siguiente vuelta
        if: steps.check.outputs.ok == 'true'
        run: |
          for i in 1 2 3; do gh workflow run reloj.yml --ref "$GITHUB_REF_NAME" && exit 0; sleep $((i * 15)); done
          exit 1

      - name: Revisar las tiendas
        if: steps.check.outputs.ok == 'true'
        run: |
          for i in 1 2 3; do gh workflow run monitor.yml --ref "$GITHUB_REF_NAME" -f origen=reloj && exit 0; sleep $((i * 15)); done
          exit 1
