[[stores]]
id = "noticias"
name = "Noticias TCG"
platform = "news"
url = "https://www.bing.com/news/search?q=Pok%C3%A9mon+TCG"
tier = "noticias"
feeds = [
  "https://www.pokebeach.com/forums/forums/front-page-news.18/index.rss",   # PokéBeach: anuncios de productos TCG
  "https://www.bing.com/news/search?q=Pok%C3%A9mon+TCG+preventa&format=rss&setlang=es&cc=ES",
  "https://www.bing.com/news/search?q=Pok%C3%A9mon+TCG+nueva+expansi%C3%B3n&format=rss&setlang=es&cc=ES",
]
pokemon_only = true
# solo titulares de producto: nuevas colecciones, cajas, expansiones, preventas…
