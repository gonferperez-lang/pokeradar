# ─────────────────────────────────────────────────────────────────────────────
#  PokéRadar · configuración
#  Edita este archivo (también desde la app de GitHub en el iPhone) para añadir
#  tiendas, cambiar palabras clave o ajustar los avisos.
# ─────────────────────────────────────────────────────────────────────────────

[general]
region = "ES"                      # ES · afecta a enlaces de búsqueda y textos
currency = "EUR"
data_dir = "docs/data"             # la app (GitHub Pages) lee de aquí
user_agent = "PokeRadar/1.0 (monitor personal de novedades Pokemon TCG)"
request_delay_seconds = 2.0        # pausa mínima entre peticiones al mismo dominio
respect_robots_txt = true          # nunca se desactiva para webs de tiendas
forget_after_days = 21             # productos no vistos en N días se eliminan del catálogo
parallel_stores = 6                # tiendas consultadas a la vez (cada una con su pausa propia)
blocked_pause_hours = 12           # si una tienda bloquea el acceso: pausa de 1 h, 2 h, 4 h… hasta N horas
ratelimit_pause_hours = 3          # si pide bajar el ritmo (HTTP 429): pausa de 1 h, 2 h… hasta N horas
card_values = true                 # cartas más caras de la colección + si compensa abrir el producto
card_sets_per_run = 8              # colecciones nuevas cuyas rarezas se piden a TCGdex por pasada (se guardan)
new_max_age_days = 30              # un producto "re-publicado" más antiguo que esto no cuenta como novedad

[filters]
# Un producto entra si su texto contiene alguna de estas palabras (sin acentos ni mayúsculas)…
# (incluye nombres de expansiones porque muchas tiendas no escriben "Pokémon" en el título)
include = [
  "pokemon", "pikachu", "charizard", "eevee", "mewtwo",
  "elite trainer", "entrenador elite", "entrenador de elite", "dresseur d'elite", "allenatore fuoriclasse",
  "top trainer box", "booster bundle", "gem pack", "paldea", "escarlata y purpura", "scarlet & violet",
  "scarlet and violet", "megaevolucion", "mega evolucion", "mega evolution", "30th celebration",
  "celebracion 30", "poke ball", "pokeball",
  "evoluciones prismaticas", "prismatic evolutions", "chispas fulgurantes", "surging sparks",
  "fuerzas temporales", "temporal forces", "mascarada crepuscular", "twilight masquerade",
  "fabula sombria", "shrouded fable", "corona astral", "stellar crown", "juntos de aventura",
  "journey together", "rivales predestinados", "destined rivals", "black bolt", "white flare",
  "llamas obsidianas", "obsidian flames", "destinos de paldea", "paldean fates", "brecha paradojica",
  "paradox rift", "caos creciente", "chaos rising", "oscuridad absoluta", "heroes ascendentes",
  "ascended heroes", "equilibrio perfecto", "perfect order", "dominio delta", "delta reign",
  "storm emerald", "inferno x", "abyss eye", "nihil zero", "heat wave arena", "battle partners",
  "terastal festival", "super electric breaker", "night wanderer", "mask of change", "crimson haze",
  "glory of team rocket", "team rocket",
]
# …y NO contiene ninguna de estas (no son cartas TCG)
exclude = [
  "figura", "figure", "peluche", "plush", "funko", "lego", "mega construx",
  "videojuego", "nintendo switch", "camiseta", "sudadera", "taza", "llavero",
  "puzzle", "mochila", "pokemon go", "tcg pocket", "tarjeta regalo", "gift card",
  "re-ment", "rement",                  # figuras en miniatura (no son cartas)
  "evento", "torneo", "inscripcion", "ticket",   # entradas a torneos, no productos
  # otros juegos de cartas que algunas tiendas etiquetan junto a Pokémon
  "one piece", "luffy", "union arena", "lorcana", "magic the gathering", "yu-gi-oh", "yugioh",
  "dragon ball", "digimon", "riftbound", "weiss schwarz", "flesh and blood", "star wars unlimited",
  "gundam", "panini", "topps", "sport cards", "futbol", "soccer", "harry potter",
  "naruto", "boruto",
  "empty", "lege", "caja vacia", "vacia", "vuota", "leere", "boite vide",   # cajas vacías de coleccionista
]

[notifications]
notify_new = true                  # producto nuevo en una tienda
notify_restock = true              # vuelve a estar en stock
notify_price_drop_pct = 0          # 0 = desactivado · p.ej. 15 = avisar si baja un 15 % o más
focus_drop_pct = 5                 # colecciones vigiladas ([[focus]]): avisar si bajan un 5 % o más
daily_digest = "21:00"             # resumen del día en un solo aviso (hora de España); "" = desactivado
notify_chollos = true              # 🔥 sellado con stock ≥15 % bajo Cardmarket o ≥10 % bajo las demás tiendas (siempre prioritario)
notify_news = true                 # noticias de Pokémon Center / lanzamientos
notify_preorders = true            # preventas nuevas y cuando una preventa pasa a poder reservarse (siempre prioritarias)
categories = ["sellado"]           # sellado · accesorio · carta suelta (las sueltas generan mucho ruido)
# Palabras que SIEMPRE avisan con prioridad alta (aunque no estén en `categories`)
watchlist = ["elite trainer", "etb", "caja de entrenador elite", "booster bundle", "display", "pokemon center", "preventa"]
max_per_run = 4                    # más avisos que esto en una pasada → se agrupan en un resumen (hay muchas tiendas)
# Canales (se configuran con *secrets* de GitHub, nunca aquí):
#   NTFY_TOPIC (obligatorio para push en iPhone) · NTFY_SERVER (opcional, por defecto https://ntfy.sh)
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (opcional)
#   APP_URL (opcional: URL de tu app en GitHub Pages, para el enlace de los avisos resumen)

# ─────────────────────────────────────────────────────────────────────────────
#  TIENDAS PRINCIPALES
# ─────────────────────────────────────────────────────────────────────────────

[[stores]]
id = "amazon"
name = "Amazon.es"
platform = "amazon_creators"       # API oficial (Creators API, sucesora de PA-API 5)
url = "https://www.amazon.es"
tier = "gran_retailer"
marketplace = "www.amazon.es"
keywords = ["Pokémon TCG", "cartas Pokémon", "Pokémon Elite Trainer Box"]
# Credenciales en secrets: AMAZON_CREDENTIAL_ID, AMAZON_CREDENTIAL_SECRET, AMAZON_PARTNER_TAG
# Opcional: AMAZON_CREDENTIAL_VERSION (3.2 por defecto en la UE; 2.2 para credenciales antiguas)
note = "Compra solo si pone «Vendido por Amazon» o «Enviado por Amazon»: los vendedores externos suelen inflar precios en lanzamientos."
trustpilot = { score = 0, reviews = 0, url = "" }

[[stores]]
id = "pokemoncenter"
name = "Pokémon Center"
platform = "news"                  # la web bloquea accesos automáticos → se vigila por noticias
url = "https://www.pokemoncenter.com/en-gb"
tier = "oficial"
note = "Tienda oficial. En Europa solo vende online en Reino Unido y Alemania (sin envío a España según la información disponible)."
feeds = [
  "https://www.pokebeach.com/forums/forums/front-page-news.18/index.rss",   # PokéBeach: portada (RSS oficial)
  # (Bing News dejó de servir RSS a programas automáticos en nov. 2026: responde con una página web)
]
pokemon_only = true                # PokéBeach solo habla de Pokémon (sus titulares no siempre lo dicen)
must_include = ["pokemon center"]
exclude = ["pocket"]
must_include_any = ["tcg", "cartas", "card", "cards", "elite trainer", "etb", "booster", "sobres",
                    "premium collection", "preventa", "pre-order", "preorder", "promo"]
trustpilot = { score = 0, reviews = 0, url = "" }

# ─────────────────────────────────────────────────────────────────────────────
#  COLECCIONES VIGILADAS DE CERCA
#  Sus productos sellados avisan siempre con prioridad alta: novedades (aunque el producto
#  sea antiguo), reposiciones y bajadas de precio desde `focus_drop_pct`. En la app tienen
#  su propia pestaña. `match`: expresiones regulares sobre el título en minúsculas y sin
#  acentos. `search`: término para buscar en las tiendas WooCommerce.
# ─────────────────────────────────────────────────────────────────────────────

[[focus]]
id = "151"
tcgdex = "sv03.5"                  # colección en TCGdex (filtro de la app)
name = "151"
match = ['(?<![\d/.,#])151(?![\d/])', '\bsv ?0?3[.,]5\b', '\bsv3pt5\b', '\bsv2a\b', '\bev ?0?3[.,]5\b']
search = "151"

[[focus]]
id = "prismaticas"
tcgdex = "sv08.5"                  # colección en TCGdex (filtro de la app)
name = "Evoluciones Prismáticas"
# incluye Terastal Festival ex (SV8a), su equivalente japonés
match = ['prismati', '\bsv ?0?8[.,]5\b', '\bsv8pt5\b', '\bsv8a\b', '\bev ?0?8[.,]5\b', 'terastal fest']
search = "prism"
short = "Prismáticas"

[[focus]]
id = "30aniversario"
tcgdex = "30th"                  # colección en TCGdex (filtro de la app)
name = "30 Aniversario"
# «30th Celebration», «30 Aniversario», «30e Anniversaire», «30° Anniversario», «30. Jubiläum», ME05.5, [30C]…
# (no confundir con «Caja 30 sobres» ni «30er Display», que son cajas de 30 sobres de otras colecciones)
match = ['\b30th\b', '\b30 ?(e|°|º|o|\.)? ?(celebrat|celebrac|anniv|aniv|jubil|ans\b|jahre|years|anos|anni\b)',
         '\b(celebrat|celebrac)\w* 30\b', '\b30c\b', '\bme ?0?5[.,]5\b']
search = ["30th", "aniversario"]

