# ─────────────────────────────────────────────────────────────────────────────
#  NOTICIAS DE LANZAMIENTOS (preventas, nuevas expansiones…)
# ─────────────────────────────────────────────────────────────────────────────

[[stores]]
id = "noticias"
name = "Noticias TCG"
platform = "news"
url = "https://www.bing.com/news/search?q=Pok%C3%A9mon+TCG"
tier = "noticias"
feeds = [
  "https://www.pokebeach.com/forums/forums/front-page-news.18/index.rss",   # PokéBeach: anuncios de productos TCG
]
pokemon_only = true
# solo titulares de producto: nuevas colecciones, cajas, expansiones, preventas…
must_include_any = ["tcg", "cartas", "preventa", "expansion", "elite trainer", "sobres", "booster", "bundle",
                    "collection", "coleccion", "box", "tin", "lata", "set", "pre-order", "preorder", "release"]
exclude = ["pocket", "videojuego", "anime", "pelicula", "trademark", "tournament results", "deck list",
           "thread", "tier list", "rotation"]   # TCG Pocket es el juego de móvil, no cartas físicas
trustpilot = { score = 0, reviews = 0, url = "" }
