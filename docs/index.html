<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PokéRadar</title>
  <meta name="description" content="Novedades y mejores precios de Pokémon TCG en Amazon, Pokémon Center y tiendas fiables.">
  <meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1020" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PokéRadar">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="30" height="30">
      <div>
        <h1>PokéRadar</h1>
        <p id="updated" class="muted">Cargando…</p>
      </div>
    </div>
    <button id="refresh" class="icon-btn" aria-label="Actualizar">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5a7 7 0 0 1 6.6 4.7h-2.6l3.5 4.3 3.5-4.3h-2.3A9 9 0 1 0 21 13h-2a7 7 0 1 1-7-8Z"/></svg>
    </button>
  </header>

  <div id="install-hint" class="install-hint" hidden>
    <span>Instálala: pulsa <b>Compartir</b> <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2 7.5 6.5l1.4 1.4L11 5.8V15h2V5.8l2.1 2.1 1.4-1.4L12 2ZM5 10v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10h-3v2h1v8H7v-8h1v-2H5Z"/></svg> y luego <b>Añadir a pantalla de inicio</b>.</span>
    <button class="link-btn" data-dismiss-install>Cerrar</button>
  </div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" role="tablist">
    <button role="tab" data-tab="novedades" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 2.5 12 8l5.5 2-5.5 2-2 5.5L8 12l-5.5-2L8 8l2-5.5Zm8 9 1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1 1-2.5Z"/></svg>
      <span>Novedades</span>
    </button>
    <button role="tab" data-tab="comparar" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
      <span>Comparar</span>
    </button>
    <button role="tab" data-tab="tiendas" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16l1 5a3 3 0 0 1-2 2.8V20H5v-8.2A3 3 0 0 1 3 9l1-5Zm1.6 2-.6 3a1 1 0 0 0 2 0V6H5.6ZM9 6v3a1 1 0 0 0 2 0V6H9Zm4 0v3a1 1 0 0 0 2 0V6h-2Zm4 0v3a1 1 0 0 0 2 0l-.6-3H17ZM7 12v6h4v-4h2v4h4v-6a3 3 0 0 1-2-.8 3 3 0 0 1-4 0 3 3 0 0 1-4 0Z"/></svg>
      <span>Tiendas</span>
    </button>
    <button role="tab" data-tab="avisos" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a6 6 0 0 1 6 6v4.6l2 3.4H4l2-3.4V8a6 6 0 0 1 6-6Zm0 2a4 4 0 0 0-4 4v5.2L7.5 14h9l-.5-.8V8a4 4 0 0 0-4-4Zm-2 14h4a2 2 0 0 1-4 0Z"/></svg>
      <span>Avisos</span>
    </button>
  </nav>

  <script src="app.js" defer></script>
</body>
</html>
